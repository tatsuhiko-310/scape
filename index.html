<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scape — Board Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="stage" id="stage">
      <div class="hud top">
        <div class="turn" id="turn"></div>
        <div class="view-btns">
          <button class="btn icon" id="rotL" title="左に回す (Q)">⟲</button>
          <button class="btn icon" id="rotR" title="右に回す (E)">⟳</button>
        </div>
      </div>
      <div class="hud bottom">
        <div class="dice-total" id="diceTotal">&nbsp;</div>
        <button class="btn primary" id="rollBtn">サイコロを振る</button>
      </div>
    </div>

    <aside class="panel">
      <section>
        <h2>セットアップ</h2>
        <label class="row">
          プレイヤー数
          <select id="playerCount">
            <option>1</option><option selected>2</option><option>3</option><option>4</option>
          </select>
        </label>
        <label class="row">
          サイコロの数
          <select id="diceCount">
            <option selected>1</option><option>2</option><option>3</option>
          </select>
        </label>
        <label class="row">
          <span>1マスずつ歩く</span>
          <input type="checkbox" id="stepMove" checked>
        </label>
        <button class="btn" id="resetBtn">リセット</button>
      </section>

      <section>
        <h2>ビジュアル</h2>
        <label class="row"><span>モノクロ・ディザ</span><input type="checkbox" id="vDither" checked></label>
        <label class="row"><span>輪郭線</span><input type="checkbox" id="vEdges" checked></label>
        <label class="row">ドットの大きさ <input type="range" id="vPixel" min="1" max="5" step="1" value="2"></label>
        <label class="row">コントラスト <input type="range" id="vContrast" min="0.6" max="2.2" step="0.05" value="1.35"></label>
      </section>

      <section>
        <h2>プレイヤー</h2>
        <ul class="players" id="players"></ul>
        <p class="hint">コマはドラッグして好きなマスへ動かせます。<br>ホイールで拡大縮小、Q / E で視点を回転。</p>
      </section>

      <section>
        <h2>ログ</h2>
        <ol class="log" id="log"></ol>
      </section>

      <section>
        <h2>マス編集</h2>
        <p class="hint">マスをクリックすると名前・アイコン・地形を変えられます。編集内容はブラウザに保存されます。</p>
        <div class="row gap">
          <button class="btn" id="exportBtn">JSON書き出し</button>
          <button class="btn" id="clearSquaresBtn">マスを初期化</button>
        </div>
      </section>
    </aside>
  </div>

  <dialog id="squareDialog">
    <form method="dialog" class="sq-form">
      <h3 id="sqTitle">マス</h3>
      <label>名前 <input id="sqName" maxlength="8"></label>
      <label>アイコン <input id="sqIcon" maxlength="2" placeholder="絵文字など"></label>
      <div class="swatches" id="sqSwatches"></div>
      <div class="row gap end">
        <button class="btn" value="cancel">キャンセル</button>
        <button class="btn primary" value="ok">保存</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/three.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/dither.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
